# ~/.tmux.conf — lean personal config (replaces the old Oh My Tmux setup)
# tmux >= 3.2 required (written against 3.7). Plugins managed by TPM.
#
# Bootstrap on a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   tmux new -s main   # then prefix + I to install plugins

# ---------------------------------------------------------------- terminal --
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# ---------------------------------------------------------------- behavior --
# C-b stays the primary prefix (Ghostty forwards Cmd+1..9 as C-b sequences);
# C-a kept as a second prefix for old Oh My Tmux muscle memory.
set -g prefix2 C-a
bind C-a send-prefix -2

set -s escape-time 10          # no delay after Esc (vim)
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -s set-clipboard on        # OSC 52 — copy reaches the macOS clipboard
set -g base-index 1            # windows and panes count from 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 5
setw -g mode-keys vi

# ----------------------------------------------------------------- windows --
# New windows start in $HOME; new panes keep the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Repeatable pane resizing (prefix once, then keep tapping)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi-style copy mode: v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ----------------------------------------------------------------- plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across panes & vim
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # sessions survive reboots
set -g @plugin 'tmux-plugins/tmux-continuum'      # ...and save/restore themselves

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Catppuccin — matches the Ghostty "Catppuccin Macchiato" theme.
# All @catppuccin_* options must be set before TPM runs.
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Keep this line last
run '~/.tmux/plugins/tpm/tpm'
